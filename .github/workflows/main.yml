name: Goo Engine 4.4 Windows CI

on:
  push:
    branches:
      - goo-engine-v4.4-release

  pull_request:
    branches:
      - goo-engine-v4.4-release

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goo-engine-4.4-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  GOO_ENGINE_BRANCH: goo-engine-v4.4-release
  GOO_ENGINE_VERSION: 4.4.3

jobs:
  build-windows:
    name: Build Goo Engine 4.4.3 - Windows x64
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout Goo Engine 4.4
        uses: actions/checkout@v5
        with:
          ref: goo-engine-v4.4-release
          fetch-depth: 0
          submodules: false
          lfs: false

      - name: Setup Git LFS
        shell: pwsh
        run: |
          git lfs install --skip-repo

      - name: Configure Git
        shell: pwsh
        run: |
          git config --global advice.detachedHead false
          git config --global protocol.version 2
          git config --global core.longpaths true

      - name: Verify Visual Studio
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

      - name: Fetch Goo Engine dependencies
        shell: pwsh
        run: |
          python .\build_files\utils\make_update.py

      - name: Build Goo Engine
        shell: cmd
        run: |
          setlocal

          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do (
            set "VS_PATH=%%i"
          )

          call "%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat"

          cl
          cmake --version
          ninja --version

          call make.bat release ninja

      - name: Package Goo Engine
        shell: cmd
        run: |
          setlocal

          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do (
            set "VS_PATH=%%i"
          )

          call "%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat"

          call make.bat package

      - name: Find Windows package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null

          $packages = Get-ChildItem -Path . -Recurse -File |
            Where-Object {
              $_.Extension -eq ".zip" -and
              $_.Name -match "blender|goo"
            }

          if ($packages.Count -eq 0) {
            Write-Host "No ZIP package was found."

            Get-ChildItem -Path . -Recurse -File |
              Where-Object {
                $_.Extension -in ".exe", ".zip"
              } |
              Select-Object FullName

            exit 1
          }

          foreach ($package in $packages) {
            Copy-Item $package.FullName artifacts\
          }

          Get-ChildItem artifacts

      - name: Generate SHA256
        shell: pwsh
        run: |
          $packages = Get-ChildItem artifacts -File

          foreach ($file in $packages) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($file.Name)" |
              Out-File -Append -Encoding ascii artifacts\SHA256SUMS.txt
          }

          Get-Content artifacts\SHA256SUMS.txt

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: goo-engine-4.4.3-windows-x64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
