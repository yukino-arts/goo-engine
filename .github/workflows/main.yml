name: Goo Engine 4.4 Windows CI

on:
  push:
    branches:
      - goo-engine-v4.4-release

  pull_request:
    branches:
      - goo-engine-v4.4-release

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goo-engine-4.4-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  GOO_ENGINE_BRANCH: goo-engine-v4.4-release
  GOO_ENGINE_VERSION: 4.4.3

jobs:
  build-windows:
    name: Build Goo Engine 4.4.3 - Windows x64
    runs-on: windows-2022

    timeout-minutes: 360

    steps:
      - name: Checkout Goo Engine 4.4
        uses: actions/checkout@v5
        with:
          ref: goo-engine-v4.4-release
          fetch-depth: 0
          submodules: false
          lfs: false

      - name: Setup Git LFS
        shell: pwsh
        run: |
          git lfs install --skip-repo

      - name: Configure Git
        shell: pwsh
        run: |
          git config --global advice.detachedHead false
          git config --global protocol.version 2
          git config --global core.longpaths true

      - name: Check Visual Studio
        shell: pwsh
        run: |
          Write-Host "Visual Studio installation:"
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

      - name: Fetch Goo Engine dependencies
        shell: pwsh
        run: |
          python .\build_files\utils\make_update.py

      - name: Configure MSVC environment
        shell: cmd
        run: |
          call "%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath > vs_path.txt
          set /p VS_PATH=<vs_path.txt
          call "%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat"
          cl
          cmake --version
          ninja --version

      - name: Configure ccache
        shell: pwsh
        run: |
          ccache --version
          ccache --zero-stats

      - name: Cache compiler data
        uses: actions/cache@v4
        with:
          path: |
            C:\Users\runneradmin\.ccache
          key: goo-engine-4.4-windows-${{ hashFiles('CMakeLists.txt', 'GNUmakefile', 'source/**') }}
          restore-keys: |
            goo-engine-4.4-windows-

      - name: Build Goo Engine
        shell: cmd
        run: |
          call "%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath > vs_path.txt
          set /p VS_PATH=<vs_path.txt
          call "%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat"

          call make.bat release ninja ccache

      - name: Package Goo Engine
        shell: cmd
        run: |
          call "%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath > vs_path.txt
          set /p VS_PATH=<vs_path.txt
          call "%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat"

          call make.bat package

      - name: Collect Windows build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null

          $files = Get-ChildItem -Path . -Recurse -File |
            Where-Object {
              $_.Name -match '^blender-4\.4\.3.*\.zip$' -or
              $_.Name -match '^blender.*windows.*\.zip$'
            }

          if ($files.Count -eq 0) {
            Write-Host "No packaged Windows archive found."
            Get-ChildItem -Path . -Recurse -File |
              Where-Object { $_.Name -match 'blender.*\.(zip|exe)$' } |
              Select-Object FullName
            exit 1
          }

          foreach ($file in $files) {
            Copy-Item $file.FullName artifacts\
          }

          $checksums = Get-ChildItem artifacts\* |
            Where-Object { -not $_.Name.EndsWith("SHA256SUMS.txt") }

          foreach ($file in $checksums) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($file.Name)" | Out-File -Append -Encoding ascii artifacts\SHA256SUMS.txt
          }

          Get-Content artifacts\SHA256SUMS.txt

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: goo-engine-4.4.3-windows-x64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
