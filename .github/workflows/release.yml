name: Goo Engine 4.4 Windows Release

on:
  push:
    tags:
      - 'goo-engine-v4.4.*'

  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, example: goo-engine-v4.4.3'
        required: true
        default: goo-engine-v4.4.3

permissions:
  contents: write

env:
  GOO_ENGINE_VERSION: 4.4.3

jobs:
  release-windows:
    name: Release Goo Engine 4.4.3 - Windows x64
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Resolve release tag
        id: release
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "tag=${{ inputs.tag }}" >> $env:GITHUB_OUTPUT
          }
          else {
            "tag=$env:GITHUB_REF_NAME" >> $env:GITHUB_OUTPUT
          }

      - name: Checkout Goo Engine
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0
          submodules: false
          lfs: false

      - name: Setup Git LFS
        shell: pwsh
        run: |
          git lfs install --skip-repo

      - name: Verify Goo Engine 4.4.3
        shell: pwsh
        run: |
          $file = "source\blender\blenkernel\BKE_blender_version.h"

          $version = Select-String `
            -Path $file `
            -Pattern '^#define BLENDER_VERSION ' |
            ForEach-Object {
              $_.Line -replace '.*BLENDER_VERSION\s+', ''
            }

          $patch = Select-String `
            -Path $file `
            -Pattern '^#define BLENDER_VERSION_PATCH ' |
            ForEach-Object {
              $_.Line -replace '.*BLENDER_VERSION_PATCH\s+', ''
            }

          Write-Host "Detected version: $version.$patch"

          if ($version -ne "404") {
            throw "Expected Blender/Goo Engine 4.4"
          }

          if ($patch -ne "3") {
            throw "Expected Blender/Goo Engine 4.4.3"
          }

      - name: Configure Git
        shell: pwsh
        run: |
          git config --global advice.detachedHead false
          git config --global protocol.version 2
          git config --global core.longpaths true

      - name: Verify Visual Studio
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

      - name: Fetch Goo Engine dependencies
        shell: pwsh
        run: |
          python .\build_files\utils\make_update.py

      - name: Build Goo Engine
        shell: cmd
        run: |
          setlocal

          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do (
            set "VS_PATH=%%i"
          )

          call "%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat"

          call make.bat release ninja

      - name: Package Goo Engine
        shell: cmd
        run: |
          setlocal

          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do (
            set "VS_PATH=%%i"
          )

          call "%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat"

          call make.bat package

      - name: Collect release package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null

          $packages = Get-ChildItem -Path . -Recurse -File |
            Where-Object {
              $_.Extension -eq ".zip" -and
              $_.Name -match "blender|goo"
            }

          if ($packages.Count -eq 0) {
            Write-Host "No Windows package found."

            Get-ChildItem -Path . -Recurse -File |
              Where-Object {
                $_.Extension -in ".exe", ".zip"
              } |
              Select-Object FullName

            exit 1
          }

          foreach ($package in $packages) {
            Copy-Item $package.FullName release-assets\
          }

          $packages = Get-ChildItem release-assets -File

          foreach ($file in $packages) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()

            "$hash  $($file.Name)" |
              Out-File -Append -Encoding ascii release-assets\SHA256SUMS.txt
          }

          Get-Content release-assets\SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Goo Engine 4.4.3 Windows
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            release-assets/*
